<!doctype html>
<html lang=en-us>
<head>
<meta charset=utf-8>
<title>YGO</title>

<style>

*, *::before, *::after {
	border: 0;
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}


body {
	position: relative;
	font-size: 0;
	font-family: 'Consolas', 'Courier New', Courier, monospace;
	user-select: none; -webkit-user-select: none;
	overflow: hidden;
}

body > div {
	display: flex;
	justify-content: center;
}

body > svg,
body > div > svg {
	position: absolute;
	top: 0;
}

svg {
	max-width: 100vw;
	max-height: 75vw;
}

svg {
	margin: 128px;
	height: calc( 100vh - 256px );
	font-size: 4px;
	font-weight: 1000;
}

svg.play g.grid rect {
	fill: #EEE;
	/* stroke: #FFF; */
	/* stroke-width: 4px; */
}

svg.play g.goal rect,
svg.play g.play rect,
svg.play g.home rect,
svg.play g.over rect {
	fill: transparent;
	stroke-width: 1px;
}

svg.play g.goal rect {
	stroke: #CAA;
}

svg.play g.home rect {
	stroke: #AAC;
}

svg.play g.over rect {
	stroke: #FFD819;
	opacity: 0;
}

svg.play text {
	fill: #AAC;
}

svg.play g.text text {
	fill: #CAA;
}

svg.play g.play rect {
	stroke: url(#gradient-fill);
}

svg.play g.over rect:hover {
	 opacity: 1;
}

svg.play g.hide,
svg.play g.hide,
svg.play g.hide,
svg.play g.hide {
	filter: blur( 4px );
}

svg.play {
	background: #FFF;
}

body {
	color: #AAC;
	background: currentColor;
	transition: color 0.4s linear;
}

body.turn {
	color: #CAA;
}

body svg {
	transform: rotate(0);
	transition: transform 0.4s ease-in-out;
}

body.turn div > svg {
	transform: rotate( 180deg );
}

body.turn svg.play {
	transform: rotate( 180deg ) rotateX( -5deg );
}

body svg.play g.home text {
	opacity: 1;
	transition: opacity 0.4s linear;
}

body svg.play g.text text {
	opacity: 0;
	transition: opacity 0.4s linear;
}

body.turn svg.play g.home text {
	opacity: 0;
}

body.turn  svg.play g.text text {
	opacity: 1;
}

body svg.play {
	transform: rotate(0) rotateX( 5deg );
	transform-style: preserve-3d;
}

body > div {
	width: 100%;
	height: 100%;
	perspective: 600px;
}


svg.menu {
	height: 100vh;
	width: 100vw;
	max-height: 100vh;
	max-width: 100vw;
	margin: 0;
}

svg g.over rect {
	transform: translateZ(-24px);
}

svg g.card use {
	filter: drop-shadow( 0 2px 2px rgba( 0, 0, 0, 0.2 ) );
}
svg.menu rect {
	fill: currentColor;
}

svg.menu {
	font-size: 40px;
}

svg.menu text {
	fill: #FFF;
	text-anchor: middle;
	opacity: 0.6;
}

svg menu text {
	fill: #FFD819;
}

svg.menu text:hover {
	opacity: 0.8;
}

</style>

<script>

function app_storage_test( type ) {
	try {
		let storage = window[type], x = "__storage_test__";
		storage.setItem( x, x );
		storage.removeItem( x );
		return true;
	} catch( ex ) {
		return ex instanceof DOMException && (
			e.code == 22                   ||
			e.code == 1014                 ||
			e.name == "QuotaExceededError" ||
			e.name == "NS_ERROR_DOM_QUOTA_REACHED"
		) && storage.length != 0;
	}
}

function app_storage() {
	this.session = 0;

	this.get = key => {};
	this.set = key => {};

	if ( ! app_storage_test( "localStorage" ) ) return;
	if ( localStorage.length > 0 ) { /* TODO */ }

	window.addEventListener( "storage", function( event ) {
		// TODO
	});

	this.get = key => localStorage.getItem( key );
	this.set = ( key, value ) => localStorage.setItem( key, value );

	this.usage = function() {
		var total = 0;

		for ( var i = 0; i < localStorage.length; i += 1 ){
			var key = localStorage.key( i );
			var amount = ( ( key.length + localStorage[ key ].length ) * 2 ) / 1024 / 1024;
			total += amount;
		}

		return total.toFixed(2) + " MB";
	}
}
