<style>

*, *::before, *::after {
	border: 0;
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}


body {
	position: relative;
	font-size: 0;
	font-family: 'Consolas', 'Courier New', Courier, monospace;
	user-select: none; -webkit-user-select: none;
	overflow: hidden;
}

body > div {
	display: flex;
	justify-content: center;
}

body > div > svg {
	position: absolute;
	top: 0;
}

svg {
	height: calc( 100vh - 64px );
	font-size: 4px;
	font-weight: 1000;
}

svg.play g.grid rect {
	fill: #EEE;
	/* stroke: #FFF; */
	/* stroke-width: 4px; */
}

svg.play g.goal rect,
svg.play g.play rect,
svg.play g.home rect,
svg.play g.over rect {
	fill: transparent;
	stroke-width: 1px;
}

svg.play g.goal rect {
	stroke: #CAA;
}

svg.play g.home rect {
	stroke: #AAC;
}

svg.play g.over rect {
	stroke: #FFD819;
	opacity: 0;
}

svg.play text {
	fill: #AAC;
}

svg.play g.play rect {
	stroke: url(#gradient-fill);
}

svg.play g.over rect:hover {
	 opacity: 1;
}

svg.play g.hide,
svg.play g.hide,
svg.play g.hide,
svg.play g.hide {
	filter: blur( 4px );
}

@keyframes         spin { 100% { transform:rotate(180deg); }}
@-moz-keyframes    spin { 100% { -moz-transform: rotate(180deg); }}
@-webkit-keyframes spin { 100% { -webkit-transform: rotate(180deg); }}

@keyframes         turn { 100% { color: #CAA; }}
@-moz-keyframes    turn { 100% { color: #CAA; }}
@-webkit-keyframes turn { 100% { color: #CAA; }}

@keyframes         fade { 100% { opacity: 0; }}
@-moz-keyframes    fade { 100% { opacity: 0; }}
@-webkit-keyframes fade { 100% { opacity: 0; }}

svg {
	margin: 32px;
}

svg.play {
	background: #FFF;
}

body {
	color: #AAC;
	background: currentColor;
}

svg.play {
	color: #AAC;
	outline: 32px solid currentColor;
}

body.turn {
	-webkit-animation: turn 1s linear forwards;
	-moz-animation:    turn 1s linear forwards;
	animation:         turn 1s linear forwards;
};

body.turn svg {
	-webkit-animation: spin 1s ease-in-out forwards, turn 1s step-start forwards;
	-moz-animation:    spin 1s ease-in-out forwards, turn 1s step-start forwards;
	animation:         spin 1s ease-in-out forwards, turn 1s step-start forwards;
};

body.turn svg.play g.home text {
	-webkit-animation: fade 1s linear forwards;
	-moz-animation:    fade 1s linear forwards;
	animation:         fade 1s linear forwards;
}

</style>

<script>

function app_storage_test( type ) {
	try {
		let storage = window[type], x = "__storage_test__";
		storage.setItem( x, x );
		storage.removeItem( x );
		return true;
	} catch( ex ) {
		return ex instanceof DOMException && (
			e.code == 22                   ||
			e.code == 1014                 ||
			e.name == "QuotaExceededError" ||
			e.name == "NS_ERROR_DOM_QUOTA_REACHED"
		) && storage.length != 0;
	}
}

function app_storage() {
	this.session = 0;

	this.get = key => {};
	this.set = key => {};

	if ( ! app_storage_test( "localStorage" ) ) return;
	if ( localStorage.length > 0 ) { /* TODO */ }

	window.addEventListener( "storage", function( event ) {
		// TODO
	});

	this.get = key => localStorage.getItem( key );
	this.set = ( key, value ) => localStorage.setItem( key, value );

	this.usage = function() {
		var total = 0;

		for ( var i = 0; i < localStorage.length; i += 1 ){
			var key = localStorage.key( i );
			var amount = ( ( key.length + localStorage[ key ].length ) * 2 ) / 1024 / 1024;
			total += amount;
		}

		return total.toFixed(2) + " MB";
	}
}
